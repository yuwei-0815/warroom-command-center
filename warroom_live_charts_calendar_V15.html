<script id="s50ClientPasteAccelerator">
(function() {
  if (window.__S50_PASTE_ACCEL_READY__) return;
  window.__S50_PASTE_ACCEL_READY__ = true;
  window.compressImageBlobToFastJpegS50_ = function(fileOrBlob, maxDim, quality) {
    maxDim = maxDim || 1440;
    quality = quality || 0.84;
    return new Promise(function(resolve, reject) {
      if (!fileOrBlob) return reject(new Error("Empty image"));
      var url = URL.createObjectURL(fileOrBlob);
      var img = new Image();
      img.onload = function() {
        try {
          var w = img.naturalWidth || img.width || 1;
          var h = img.naturalHeight || img.height || 1;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var nw = Math.max(1, Math.round(w * scale));
          var nh = Math.max(1, Math.round(h * scale));
          var cvs = document.createElement("canvas");
          cvs.width = nw;
          cvs.height = nh;
          var ctx = cvs.getContext("2d");
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, nw, nh);
          ctx.drawImage(img, 0, 0, nw, nh);
          var dataUrl = cvs.toDataURL("image/jpeg", quality);
          URL.revokeObjectURL(url);
          resolve(dataUrl);
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function(e) {
        URL.revokeObjectURL(url);
        reject(e);
      };
      img.src = url;
    });
  };

  document.addEventListener("paste", function(ev) {
    try {
      var items = (ev.clipboardData || (ev.originalEvent && ev.originalEvent.clipboardData) || {}).items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image/") === 0) {
          var blob = items[i].getAsFile();
          var activeFileInput = document.querySelector('input[type="file"][accept*="image"]:not([disabled])');
          if (blob && activeFileInput && typeof DataTransfer !== "undefined") {
            window.compressImageBlobToFastJpegS50_(blob, 1440, 0.84).then(function(dataUrl) {
              var arr = dataUrl.split(","), bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
              while (n--) u8[n] = bstr.charCodeAt(n);
              var fastFile = new File([u8], "pasted_" + Date.now() + ".jpg", { type: "image/jpeg" });
              var dt = new DataTransfer();
              dt.items.add(fastFile);
              activeFileInput.files = dt.files;
              activeFileInput.dispatchEvent(new Event("change", { bubbles: true }));
              if (typeof window.showToast === "function") {
                window.showToast("⚡ 已極速壓縮並貼上剪貼簿照片 (" + Math.round(u8.length / 1024) + " KB)");
              }
            }).catch(function() {});
          }
          break;
        }
      }
    } catch (_ePaste) {}
  }, false);
})();
</script>
<script id="s60OneClickBotDeployerScript">
(function() {
  if (window.__S60_ONECLICK_DEPLOYER_READY__) return;
  window.__S60_ONECLICK_DEPLOYER_READY__ = true;

  var S60_MASTER_GATEWAY_URL = "https://script.google.com/macros/s/AKfycbxRcVWuQzMEQWtGMd-PNqBr6ejcxjTvRLuxeRut38uwFFveHrPJDb6bbe3cRp4hkSXTsQ/exec";
  window.__S60_STAGED_FILES__ = [];

  var CAT_LABELS = {
    CONTRACT: "📄 01. 工程契約書／合約條款",
    BID_BOQ: "📊 02. 工程標單／詳細價目表",
    DRAWING: "📐 03. 施工圖說／BIM 清冊",
    APPROVED_MAT: "📑 04. 送審核定材料型錄",
    SPEC_SOP: "📋 05. 施工規範與查驗基準"
  };

  function renderS60StagedFiles() {
    var list = window.__S60_STAGED_FILES__ || [];
    var hint = document.getElementById("s60StagedFilesEmptyHint");
    var wrap = document.getElementById("s60StagedFilesTableWrap");
    var tbody = document.getElementById("s60StagedFilesTbody");
    if (!tbody) return;
    if (list.length === 0) {
      if (hint) hint.style.display = "block";
      if (wrap) wrap.style.display = "none";
      tbody.innerHTML = "";
      return;
    }
    if (hint) hint.style.display = "none";
    if (wrap) wrap.style.display = "block";
    tbody.innerHTML = list.map(function(f, idx) {
      var kb = Math.max(1, Math.round((f.sizeBytes || 0) / 1024));
      return '<tr>' +
        '<td style="font-weight:700;color:var(--text-main);">' + f.fileName + '</td>' +
        '<td>' + (CAT_LABELS[f.category] || f.category) + '</td>' +
        '<td>' + kb + ' KB</td>' +
        '<td style="text-align:center;"><button type="button" class="btn btn-ghost" style="padding:2px 8px;font-size:0.72rem;" onclick="window.removeS60StagedFile(' + idx + ')">移除</button></td>' +
      '</tr>';
    }).join("");
  }

  window.removeS60StagedFile = function(idx) {
    window.__S60_STAGED_FILES__.splice(idx, 1);
    renderS60StagedFiles();
  };

  window.handleS60ContractFilesSelected = function(ev) {
    var files = ev && ev.target && ev.target.files ? Array.prototype.slice.call(ev.target.files) : [];
    var catEl = document.getElementById("s60UploadDocCategorySelect");
    var cat = catEl ? catEl.value : "CONTRACT";
    if (!files.length) return;
    files.forEach(function(file) {
      if (file.size > 18 * 1024 * 1024) {
        if (typeof window.showToast === "function") window.showToast("⚠️ 單一檔案超過 18MB，建議先放置於雲端資料夾並於步驟 2 貼上網址！");
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = String(e.target.result || "");
        var b64 = dataUrl.indexOf("base64,") !== -1 ? dataUrl.split("base64,")[1] : "";
        window.__S60_STAGED_FILES__.push({
          fileName: file.name,
          mimeType: file.type || "application/octet-stream",
          sizeBytes: file.size,
          category: cat,
          base64: b64
        });
        renderS60StagedFiles();
      };
      reader.readAsDataURL(file);
    });
    ev.target.value = "";
  };

  window.fillS60DemoSandboxPreset = function() {
    var setVal = function(id, v) { var el = document.getElementById(id); if (el) el.value = v; };
    setVal("s60BotCodeInput", "BOT_YINGGE_DEMO");
    setVal("s60BotDisplayNameInput", "鶯歌消防局工務機器人 (一鍵部署驗證機)");
    setVal("s60ProjectNameInput", "新北市政府消防局北區複合型災害應變暨訓練中心新建工程(鶯歌消防局)");
    setVal("s60SiteAddressInput", "新北市鶯歌區尖山路101巷");
    setVal("s60LineChannelTokenInput", "SANDBOX_DEMO_LINE_CHANNEL_TOKEN_S60");
    setVal("s60PathNasRoot", "\\\\dogreatnas.synology.me\\元順工程-鶯歌消防局\\60-機電相關");
    var sampleContract = "【工程契約摘要與勞安環保罰則條款】\n工程名稱：鶯歌消防局新建工程\n未配戴安全帽或未穿合格安全鞋：每人次罰款新臺幣 3,000 元整。\n降雨達 24h >= 50mm 得檢具最近測站觀測資料申請工期展延。";
    var sampleBoq = "項次,工項名稱,規格,契約數量,單位,單價\n壹.一.1,共同管溝電力幹管,PVC Ø100mm (4\"),680,M,420\n壹.一.2,共同管溝弱電光纖管,PVC Ø80mm (3\"),680,M,310\n壹.二.1,臨時總配電盤,MP-TEMP 3Φ4W 400A,1,座,185000";
    window.__S60_STAGED_FILES__ = [
      {
        fileName: "01_鶯歌消防局_工程契約書與安衛罰款條款摘要.txt",
        mimeType: "text/plain",
        sizeBytes: sampleContract.length,
        category: "CONTRACT",
        base64: btoa(unescape(encodeURIComponent(sampleContract)))
      },
      {
        fileName: "02_鶯歌消防局_機電標單詳細價目表_V1.csv",
        mimeType: "text/csv",
        sizeBytes: sampleBoq.length,
        category: "BID_BOQ",
        base64: btoa(unescape(encodeURIComponent(sampleBoq)))
      }
    ];
    renderS60StagedFiles();
    if (typeof window.showToast === "function") {
      window.showToast("✅ 已載入範例設定與 2 份測試合約／標單檔案！請點擊「⚡ 沙盒預演測試」體驗一鍵部署。");
    }
  };

  function collectS60Payload(isDryRun) {
    var val = function(id) { var el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; };
    var tier = val("s60BotTierSelect") || "TIER_2";
    var flagsMap = {};
    if (typeof BOT_FEATURE_FLAGS !== "undefined" && Array.isArray(BOT_FEATURE_FLAGS)) {
      BOT_FEATURE_FLAGS.forEach(function(f) {
        flagsMap[f.key] = (tier === "TIER_1") ? Boolean(f.tier1) : ((tier === "TIER_2") ? Boolean(f.tier2) : Boolean(f.tier3));
      });
    }
    return {
      internalAction: "ONE_CLICK_PROVISION_BOT_S60",
      dryRun: Boolean(isDryRun),
      botCode: (val("s60BotCodeInput") || "BOT_C").replace(/[^A-Za-z0-9_]/g, "_").toUpperCase(),
      botName: val("s60BotDisplayNameInput") || "新工務專責機器人",
      tier: tier,
      projectName: val("s60ProjectNameInput") || "新建工程專案",
      siteAddress: val("s60SiteAddressInput") || "",
      schedules: val("s60SchedulesInput") || "08:00 / 09:00 / 15:00 / 19:00",
      lineChannelToken: val("s60LineChannelTokenInput"),
      lineChannelSecret: val("s60LineChannelSecretInput"),
      primaryGroupId: val("s60PrimaryGroupIdInput"),
      paths: {
        rootFolder: val("s60PathRootFolder"),
        contractFolder: val("s60PathContractFolder"),
        bidBoqFolder: val("s60PathBidBoqFolder"),
        drawingFolder: val("s60PathDrawingFolder"),
        approvedMatFolder: val("s60PathApprovedMatFolder"),
        matReceiptFolder: val("s60PathMatReceiptFolder"),
        constInspFolder: val("s60PathConstInspFolder"),
        dailyPhotoFolder: val("s60PathDailyPhotoFolder"),
        ncrSafetyFolder: val("s60PathNcrSafetyFolder"),
        spreadsheetId: val("s60PathSpreadsheetId"),
        nasRootPath: val("s60PathNasRoot")
      },
      featureFlags: flagsMap,
      files: (window.__S60_STAGED_FILES__ || []).slice()
    };
  }

  function registerDeployedBotIntoWarRoomUi(res, reqPayload) {
    try {
      var bCode = res.botCode || reqPayload.botCode;
      var tier = reqPayload.tier || "TIER_2";
      var tierLabels = { TIER_1: "第一級：工班群組", TIER_2: "第二級：工務所群組", TIER_3: "第三級：管理者" };
      var botEntry = {
        botId: bCode,
        botCode: bCode,
        tier: tier,
        tierLabel: (tierLabels[tier] || tier) + " — " + bCode,
        botName: reqPayload.botName,
        project: reqPayload.projectName,
        webhook: res.webhookEndpointUrl || (S60_MASTER_GATEWAY_URL + "?botId=" + encodeURIComponent(bCode)),
        scriptId: "DYNAMIC_GATEWAY_" + bCode,
        deploymentId: "S60_ONECLICK_" + bCode,
        spreadsheetId: (res.folders && res.folders.spreadsheetId) || "1sEut2NPfeCBiq-jjdVFuTI_nv-ZXK7z_TZMJOPc2e0s",
        schedules: reqPayload.schedules,
        nasPath: (reqPayload.paths && reqPayload.paths.nasRootPath) || "",
        paths: res.folders || {},
        uploadedDocs: res.uploadedDocs || [],
        group1Name: reqPayload.primaryGroupId ? ("群組一：" + reqPayload.primaryGroupId) : ("群組一：" + reqPayload.projectName + " 施工主群"),
        group1Enabled: true,
        group2Name: "群組二：" + reqPayload.projectName + " 工務查驗群",
        group2Enabled: true,
        group1Flags: [true, true, true, true, true, true, true, true, false, false, true, false, false],
        group2Flags: [true, true, true, true, true, true, true, true, true, true, true, tier === "TIER_3", tier === "TIER_3"]
      };
      if (typeof BOT_INSTANCES_LIST !== "undefined" && Array.isArray(BOT_INSTANCES_LIST)) {
        var existIdx = -1;
        for (var i = 0; i < BOT_INSTANCES_LIST.length; i++) {
          if (BOT_INSTANCES_LIST[i] && BOT_INSTANCES_LIST[i].botCode === bCode) { existIdx = i; break; }
        }
        if (existIdx >= 0) BOT_INSTANCES_LIST[existIdx] = botEntry;

      if (typeof saveBotGroup12ToStorage === "function") saveBotGroup12ToStorage();

      if (typeof DEPLOYED_GROUP_BOTS !== "undefined" && Array.isArray(DEPLOYED_GROUP_BOTS)) {

          mode: res.dryRun ? "沙盒預演驗證通過" : "已正式綁定上線",
          webhookUrl: botEntry.webhook,
          status: res.webhookBound ? "✅ LINE Webhook 已自動綁定" : "✅ 雲端路由與資料夾已就緒"
        });
        if (typeof renderDeployedBotsRegistry === "function") renderDeployedBotsRegistry();
      }
    } catch (_eRegUi) {}

  window.executeS60OneClickBotProvision = function(isDryRun) {
    var payload = collectS60Payload(isDryRun);
    if (!isDryRun && (!payload.lineChannelToken || payload.lineChannelToken.indexOf("SANDBOX_") === 0)) {
      if (typeof window.showToast === "function") {
        window.showToast("💡 尚未填入正式 LINE Channel Access Token，已自動切換為「沙盒預演模式」驗證雲端建夾與合約上傳！");
      }
      payload.dryRun = true;
    }

      panel.style.display = "block";
      panel.style.background = "#eff6ff";
      panel.style.borderColor = "#2563eb";
      panel.style.color = "#1e3a8a";

    }

    // Use CORS-safe text/plain POST (zero OPTIONS preflight block on Google Apps Script!)
    fetch(S60_MASTER_GATEWAY_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (!res || !res.ok) throw new Error((res && res.error) || "部署回應異常");

        if (panel) {
          panel.style.background = "#f0fdf4";
          panel.style.borderColor = "#16a34a";
          panel.style.color = "#14532d";
          var stepsHtml = (res.stages || []).map(function(st) {
            return "<div>" + (st.ok ? "✅" : "⚠️") + " <strong>" + st.name + "：</strong>" + st.detail + "</div>";
          }).join("");
          var docsHtml = (res.uploadedDocs || []).map(function(d) {
            return '<li><a href="' + d.viewerUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">' + d.fileName + '</a>（分類：' + d.category + '）</li>';

          if (res.folders && res.folders.constInspFolderUrl) fldLinks.push('<a href="' + res.folders.constInspFolderUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">📸 查驗PDF資料夾</a>');
          if (res.folders && res.folders.dailyPhotoFolderUrl) fldLinks.push('<a href="' + res.folders.dailyPhotoFolderUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">👷 施工/工具箱照片夾</a>');

          panel.innerHTML =
            '<div style="font-size:0.9rem;font-weight:900;margin-bottom:6px;">🎉 【' + res.botCode + '｜' + payload.botName + '】' + (res.dryRun ? '沙盒預演部署 100% 成功！' : '一鍵正式部署上線完成！') + '</div>' +
            '<div style="margin-bottom:6px;">🔗 <strong>專屬 Webhook 端點（已自動支援免新建 GAS 專案）：</strong><code>' + res.webhookEndpointUrl + '</code></div>' +
            (fldLinks.length ? ('<div style="margin-bottom:6px;">📁 <strong>已建置／綁定雲端路徑：</strong>' + fldLinks.join(" ｜ ") + '</div>') : '') +
            stepsHtml +
            (docsHtml ? ('<div style="margin-top:6px;"><strong>📑 已上傳並建立 LINE 即時查詢索引之合約／標單檔案：</strong><ul style="margin:4px 0 0 18px;">' + docsHtml + '</ul></div>') : '') +
            '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #86efac;">💡 <strong>LINE 實機測試指令：</strong>於該機器人對話視窗輸入 <code>合約</code>、<code>標單</code>、<code>路徑</code>、<code>開啟圖說</code> 或直接傳送工具箱／白板查驗照片，即自動歸入上方設定之專屬路徑！</div>';
        }
        if (typeof window.showToast === "function") {
          window.showToast("🎉 【" + res.botCode + "】已完成雲端路徑綁定、合約歸檔與 LINE Bot 部署！");
        }
      })
      .catch(function(err) {
        if (panel) {
          panel.style.background = "#fef2f2";
          panel.style.borderColor = "#dc2626";
          panel.style.color = "#7f1d1d";
          panel.innerHTML = "❌ <strong>連線遠端部署閘道失敗：</strong>" + String(err && err.message || err);
        }
      });
  };
})();
</script>
