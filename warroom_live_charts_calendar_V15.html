<script id="s50ClientPasteAccelerator">
(function() {
  if (window.__S50_PASTE_ACCEL_READY__) return;
  window.__S50_PASTE_ACCEL_READY__ = true;
  window.compressImageBlobToFastJpegS50_ = function(fileOrBlob, maxDim, quality) {
    maxDim = maxDim || 1440;
    quality = quality || 0.84;
    return new Promise(function(resolve, reject) {
      if (!fileOrBlob) return reject(new Error("Empty image"));
      var url = URL.createObjectURL(fileOrBlob);
      var img = new Image();
      img.onload = function() {
        try {
          var w = img.naturalWidth || img.width || 1;
          var h = img.naturalHeight || img.height || 1;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var nw = Math.max(1, Math.round(w * scale));
          var nh = Math.max(1, Math.round(h * scale));
          var cvs = document.createElement("canvas");
          cvs.width = nw;
          cvs.height = nh;
          var ctx = cvs.getContext("2d");
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, nw, nh);
          ctx.drawImage(img, 0, 0, nw, nh);
          var dataUrl = cvs.toDataURL("image/jpeg", quality);
          URL.revokeObjectURL(url);
          resolve(dataUrl);
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function(e) {
        URL.revokeObjectURL(url);
        reject(e);
      };
      img.src = url;
    });
  };

  document.addEventListener("paste", function(ev) {
    try {
      var items = (ev.clipboardData || (ev.originalEvent && ev.originalEvent.clipboardData) || {}).items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image/") === 0) {
          var blob = items[i].getAsFile();
          var activeFileInput = document.querySelector('input[type="file"][accept*="image"]:not([disabled])');
          if (blob && activeFileInput && typeof DataTransfer !== "undefined") {
            window.compressImageBlobToFastJpegS50_(blob, 1440, 0.84).then(function(dataUrl) {
              var arr = dataUrl.split(","), bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
              while (n--) u8[n] = bstr.charCodeAt(n);
              var fastFile = new File([u8], "pasted_" + Date.now() + ".jpg", { type: "image/jpeg" });
              var dt = new DataTransfer();
              dt.items.add(fastFile);
              activeFileInput.files = dt.files;
              activeFileInput.dispatchEvent(new Event("change", { bubbles: true }));
              if (typeof window.showToast === "function") {
                window.showToast("⚡ 已極速壓縮並貼上剪貼簿照片 (" + Math.round(u8.length / 1024) + " KB)");
              }
            }).catch(function() {});
          }
          break;
        }
      }
    } catch (_ePaste) {}
  }, false);
})();
</script>

          if (res.folders && res.folders.contractFolderUrl) fldLinks.push('<a href="' + res.folders.contractFolderUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">📄 合約夾</a>');
          if (res.folders && res.folders.bidBoqFolderUrl) fldLinks.push('<a href="' + res.folders.bidBoqFolderUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">📊 標單夾</a>');
          if (res.folders && res.folders.constInspFolderUrl) fldLinks.push('<a href="' + res.folders.constInspFolderUrl + '" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">📸 查驗PDF夾</a>');

          panel.innerHTML =
            '<div style="font-size:0.95rem;font-weight:900;color:#16a34a;margin-bottom:6px;">🎉 【' + res.botCode + '｜' + payload.botName + '】' + (res.dryRun ? '沙盒預演建置完成！' : '一鍵部署上線成功！') + '</div>' +
            '<div style="margin-bottom:6px;">🔗 <strong>專屬 Webhook 網址（已自動寫入）：</strong><code>' + res.webhookEndpointUrl + '</code></div>' +
            (fldLinks.length ? ('<div style="margin-bottom:6px;">📁 <strong>雲端資料夾直連：</strong>' + fldLinks.join(" ｜ ") + '</div>') : '') +
            stepsHtml +
            (docsHtml ? ('<div style="margin-top:6px;"><strong>📑 已建立 LINE 即時查詢索引之檔案：</strong><ul style="margin:4px 0 0 18px;">' + docsHtml + '</ul></div>') : '') +
            '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-std);">💡 <strong>下一步：</strong>確認 <a href="https://developers.line.biz/console/" target="_blank" rel="noopener" style="color:#0284c7;font-weight:700;">LINE Developers ↗</a> 內 <code>Use webhook</code> 為開啟，將機器人邀入 LINE 群組傳送 <code>合約</code>、<code>標單</code> 或現場照片即可自動運作！</div>';
        }
        if (typeof window.showToast === "function") {
          window.showToast("🎉 【" + res.botCode + "】已完成雲端建夾、合約歸檔與 LINE Bot 部署！");
        }
      })
      .catch(function(err) {
        if (panel) {
          panel.style.borderColor = "#dc2626";
          panel.innerHTML = "❌ <strong>連線遠端部署閘道失敗：</strong>" + String(err && err.message || err);
        }
      });
  };

  // S6.1 Navigation & Zero-Clutter Enhancement:
  // 1) Inject "+ 新增機器人（一鍵部署）" directly into #deployedBotTabsBar so users find it immediately!
  // 2) Hide #daily0600SimTestCenterCard while viewing the One-Click Deploy wizard so the form sits right at the top!
  window.openS61OneClickNewBotWizard = function() {
    if (typeof window.switchBotConfigSubTab === "function") {
      window.switchBotConfigSubTab("remote_std");
    }
    var wb = document.getElementById("s60OneClickDeployWorkbench");
    if (wb && wb.scrollIntoView) wb.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  function enhanceBotTabsAndSubTabFocusS61() {
    if (typeof window.renderDeployedBotTabsBar === "function" && !window.renderDeployedBotTabsBar.__s61Wrapped) {
      var origRenderTabs = window.renderDeployedBotTabsBar;
      var wrappedRender = function() {
        origRenderTabs.apply(this, arguments);
        var bar = document.getElementById("deployedBotTabsBar");
        if (!bar) return;
        var remotePane = document.getElementById("botSubPaneRemoteStd");
        var isRemoteActive = Boolean(remotePane && remotePane.style.display !== "none");
        if (!document.getElementById("btnQuickAddNewBotS61")) {
          var addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.id = "btnQuickAddNewBotS61";
          addBtn.className = isRemoteActive ? "btn btn-primary" : "btn btn-emerald";
          addBtn.style.cssText = "padding:7px 14px;font-size:0.82rem;font-weight:800;";
          addBtn.innerHTML = "＋ 新增 LINE 機器人（一鍵部署）";
          addBtn.onclick = window.openS61OneClickNewBotWizard;
          bar.appendChild(addBtn);
        }
      };
      wrappedRender.__s61Wrapped = true;
      window.renderDeployedBotTabsBar = wrappedRender;
      try { window.renderDeployedBotTabsBar(); } catch (_eInitBar) {}
    }

    if (typeof window.switchBotConfigSubTab === "function" && !window.switchBotConfigSubTab.__s61Wrapped) {
      var origSwitch = window.switchBotConfigSubTab;
      var wrappedSwitch = function(subTab) {
        origSwitch.apply(this, arguments);
        var simCard = document.getElementById("daily0600SimTestCenterCard");
        if (simCard) {
          simCard.style.display = (subTab === "remote_std") ? "none" : "block";
        }
      };
      wrappedSwitch.__s61Wrapped = true;
      window.switchBotConfigSubTab = wrappedSwitch;
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhanceBotTabsAndSubTabFocusS61);
  } else {
    enhanceBotTabsAndSubTabFocusS61();
  }
})();
</script>
</body></html>
